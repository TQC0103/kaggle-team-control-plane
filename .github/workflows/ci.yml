name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: desktop-requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r desktop-requirements.txt pytest==9.1.1

      - name: Test backend, desktop, agent, and plugin
        run: |
          python -m unittest discover -s tests_backend -v
          python -m unittest discover -s tests_desktop -v
          python -m unittest discover -s agent_interface/tests -v
          python -m pytest plugins/kaggle-control-plane/scripts/test_server.py -q

      - name: Compile Python sources
        run: python -m compileall -q control_plane desktop_app agent_interface plugins/kaggle-control-plane/scripts

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint and test frontend
        run: |
          npm run lint
          npm test

      - name: Check patch hygiene
        run: git diff --check
